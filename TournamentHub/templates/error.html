{% extends "base.html" %}
{% block title %}Ошибка {{ code }} — TournamentHub{% endblock %}
{% block content %}
<div class="error-page"><div class="error-code">{{ code }}</div><span class="eyebrow">OOPS, SOMETHING WENT WRONG</span><h1>{{ 'Доступ запрещён' if code==403 else 'Страница не найдена' if code==404 else 'Некорректный запрос' }}</h1><p class="muted">{{ message }}</p><a class="btn primary" href="{{ url_for('index') }}">На главную</a></div>
{% endblock %}
